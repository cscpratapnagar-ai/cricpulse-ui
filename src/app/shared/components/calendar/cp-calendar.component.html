<div class="field">
  @if (label) {
    <label [for]="id"
      >{{ label }}
      @if (required) {
        <span>*</span>
      }
    </label>
  }
  <div class="calendar-shell">
    <input
      [id]="id"
      [name]="name || id"
      type="date"
      [value]="value || ''"
      [min]="min || null"
      [max]="max || null"
      [disabled]="disabled"
      [required]="required"
      (change)="onChange($event)"
    />
    <span class="calendar-icon" aria-hidden="true">▣</span>
  </div>
  @if (hint) {
    <small>{{ hint }}</small>
  }
</div>
