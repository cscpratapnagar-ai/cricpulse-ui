<label class="field"
  ><span *ngIf="label">{{ label }}</span>
  <div class="select-wrap">
    <button
      type="button"
      class="select-trigger"
      [disabled]="disabled"
      [class.disabled]="disabled"
      [class.open]="open"
      (click)="toggle()"
    >
      <span [class.muted]="!selectedOption">{{ selectedOption?.label || placeholder }}</span
      ><b>v</b>
    </button>
    @if (open && !disabled) {
      <div class="options" [class.up]="openUp" role="listbox">
        <button
          type="button"
          class="option placeholder-option"
          [class.active]="!value"
          (click)="select({ value: '', label: placeholder })"
        >
          {{ placeholder }}
        </button>
        @for (option of options; track option.value) {
          <button
            type="button"
            class="option"
            [class.active]="option.value === value"
            (click)="select(option)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    }
  </div></label
>
