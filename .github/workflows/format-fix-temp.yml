name: Temporary Prettier Fix

on:
  push:
    branches:
      - feat/scorer-recovery-race-protection

permissions:
  contents: write

jobs:
  format-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx --yes prettier@3.5.3 --write "src/app/features/broadcast/pages/control/broadcast-control.component.html" "src/app/features/broadcast/pages/control/broadcast-control.component.scss" "src/app/features/broadcast/pages/control/broadcast-control.component.ts" "src/app/features/broadcast/pages/overlay/broadcast-overlay.component.html" "src/app/features/broadcast/pages/overlay/broadcast-overlay.component.scss" "src/app/features/broadcast/pages/overlay/broadcast-overlay.component.ts"
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/broadcast/pages/control/broadcast-control.component.html src/app/features/broadcast/pages/control/broadcast-control.component.scss src/app/features/broadcast/pages/control/broadcast-control.component.ts src/app/features/broadcast/pages/overlay/broadcast-overlay.component.html src/app/features/broadcast/pages/overlay/broadcast-overlay.component.scss src/app/features/broadcast/pages/overlay/broadcast-overlay.component.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "chore: apply prettier formatting"
            git push
          fi
