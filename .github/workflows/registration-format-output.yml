name: Temporary registration formatter output
on:
  push:
    branches:
      - feat/team-registration-workflow
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical formatting
        run: |
          npx --yes prettier@3.5.3 --write src/app/features/tournaments/pages/team-registration/team-registration.component.{ts,html,scss}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/tournaments/pages/team-registration/team-registration.component.{ts,html,scss}
          if ! git diff --cached --quiet; then
            git commit -m "style(registration): apply canonical Prettier formatting"
            git push
          fi
