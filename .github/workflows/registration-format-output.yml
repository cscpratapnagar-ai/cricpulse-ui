name: Temporary registration formatter output
on:
  push:
    branches:
      - feat/team-registration-workflow
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format and print exact files
        run: |
          npx --yes prettier@3.5.3 --write src/app/features/tournaments/pages/team-registration/team-registration.component.{ts,html,scss}
          for file in src/app/features/tournaments/pages/team-registration/team-registration.component.{ts,html,scss}; do
            echo "===== FILE: $file ====="
            cat "$file"
            echo "===== END FILE ====="
          done
