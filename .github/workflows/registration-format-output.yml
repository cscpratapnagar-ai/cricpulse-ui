name: Temporary route formatter
on:
  push:
    branches:
      - feat/team-registration-workflow
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npx --yes prettier@3.5.3 --write src/app/app.routes.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/app.routes.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(registration): format route configuration"
            git push
          fi
