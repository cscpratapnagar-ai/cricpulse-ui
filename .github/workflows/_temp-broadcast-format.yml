name: Temporary Live Score Formatter

on:
  push:
    branches: [ develop ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - run: npx --yes prettier@3.5.3 --write "src/app/features/public/pages/live-score/public-live-score.component.ts"
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/public/pages/live-score/public-live-score.component.ts
          git commit -m "style(live-score): apply exact Prettier formatting"
          git push
