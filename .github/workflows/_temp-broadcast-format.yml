name: Temp Broadcast Formatter

on:
  push:
    branches: [ feat/universal-broadcast-engine ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx --yes prettier@3.5.3 --write "src/app/features/broadcast/pages/overlay/broadcast-overlay.component.{ts,html,scss}"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/broadcast/pages/overlay/broadcast-overlay.component.{ts,html,scss}
          git diff --cached --quiet || git commit -m "chore(broadcast): format universal overlay"
          git push
