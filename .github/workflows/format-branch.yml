name: Temporary format fixer

on:
  push:
    branches:
      - feat/public-match-shareable-lifecycle

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - run: npm install --no-audit --no-fund
      - run: npx --yes prettier@3.5.3 --write "src/**/*.{ts,html,scss,css,json}" "scripts/**/*.{mjs,js}" "*.json"
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src scripts '*.json'
            git commit -m "style(public): apply repository prettier formatting"
            git push
          fi
