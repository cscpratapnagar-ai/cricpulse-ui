name: One-time API endpoint refactor

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message != 'refactor(api): centralize remaining frontend endpoints'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Replace hardcoded API endpoints
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const root = 'src/app';
          for (const file of walk(root).filter((name) => name.endsWith('.ts'))) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes('http://localhost:8080/api')) continue;
            if (file.endsWith('src/app/core/config/api.config.ts')) continue;

            source = source.replaceAll('http://localhost:8080/api', '${API_BASE_URL}');
            if (!source.includes("from '../../../../core/config/api.config'")) {
              source = "import { API_BASE_URL } from '../../../../core/config/api.config';\n" + source;
            }
            fs.writeFileSync(file, source);
          }
          NODE
      - name: Format changed frontend files
        run: npx --yes prettier@3.5.3 --write "src/**/*.{ts,html,scss,css,json}"
      - name: Verify no hardcoded endpoints remain
        run: |
          if grep -RIn --include='*.ts' 'http://localhost:8080/api' src/app; then
            echo 'Hardcoded API endpoints remain.'
            exit 1
          fi
      - name: Commit refactor and remove one-time workflow
        run: |
          rm .github/workflows/refactor-api-endpoints-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/refactor-api-endpoints-once.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "refactor(api): centralize remaining frontend endpoints"
          git push origin develop
