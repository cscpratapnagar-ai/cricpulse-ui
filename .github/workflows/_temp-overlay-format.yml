name: Temporary Overlay Format

on:
  push:
    branches:
      - 'feat/premium-broadcast-overlay-v2'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Format overlay files
        run: npx --yes prettier@3.5.3 --write src/app/features/broadcast/pages/overlay/broadcast-overlay.component.html src/app/features/broadcast/pages/overlay/broadcast-overlay.component.scss
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/broadcast/pages/overlay/broadcast-overlay.component.html src/app/features/broadcast/pages/overlay/broadcast-overlay.component.scss
          git commit -m "chore(broadcast): normalize overlay formatting"
          git push
