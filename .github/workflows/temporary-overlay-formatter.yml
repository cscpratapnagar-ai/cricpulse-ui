name: Temporary overlay formatter

on:
  push:
    branches:
      - feat/premium-tv-broadcast-overlay

permissions:
  contents: write

jobs:
  format-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/premium-tv-broadcast-overlay

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format overlay files
        run: |
          npm install --no-audit --no-fund
          npx --yes prettier@3.5.3 --write \
            src/app/features/broadcast/pages/overlay/broadcast-overlay.component.ts \
            src/app/features/broadcast/pages/overlay/broadcast-overlay.component.html \
            src/app/features/broadcast/pages/overlay/broadcast-overlay.component.scss

      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/broadcast/pages/overlay/broadcast-overlay.component.ts \
            src/app/features/broadcast/pages/overlay/broadcast-overlay.component.html \
            src/app/features/broadcast/pages/overlay/broadcast-overlay.component.scss
          git rm .github/workflows/temporary-overlay-formatter.yml
          git diff --cached --quiet || git commit -m "style(broadcast): format premium overlay"
          git push origin HEAD:feat/premium-tv-broadcast-overlay
