name: Temporary Prettier Fix

on:
  push:
    branches:
      - feat/public-match-center

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes prettier@3.5.3 --write src/app/features/public/pages/live-score/public-live-score.component.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/public/pages/live-score/public-live-score.component.ts
          git commit -m "chore(public): apply prettier formatting"
          git push
