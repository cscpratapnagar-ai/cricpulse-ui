name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - ui
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - develop
      - ui

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting and TypeScript quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify formatting
        run: npm run format:check
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Audit canonical component structure
        run: npm run component:audit

      - name: Audit route integrity
        run: npm run route:audit

      - name: Audit critical test inventory
        run: npm run test:inventory

      - name: Audit legacy compatibility shims
        run: npm run legacy:audit

  build:
    name: Angular production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Angular production build
        run: npm run build -- --configuration production
