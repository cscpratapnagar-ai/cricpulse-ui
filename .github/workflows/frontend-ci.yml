name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - ui
      - 'feature/**'
      - 'refactor/**'
      - 'test/tournament-playoff-lifecycle-e2e'
  pull_request:
    branches:
      - main
      - develop
      - ui

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting and TypeScript quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python for OBS local relay validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate OBS local relay syntax
        run: python -m py_compile tools/obs-local-relay.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit CI security and reproducibility policy
        run: npm run ci:policy:audit
      - name: Verify formatting
        run: npm run format:check
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Audit canonical component structure
        run: npm run component:audit
      - name: Audit route integrity
        run: npm run route:audit
      - name: Audit critical test inventory
        run: npm run test:inventory
      - name: Audit security and API boundaries
        run: npm run security:audit
      - name: Audit production image provenance configuration
        run: npm run release:provenance:audit
      - name: Audit feature integration boundaries
        run: npm run feature:audit
      - name: Execute Angular unit tests
        run: npm run test
      - name: Audit legacy compatibility shims
        run: npm run legacy:audit

  build:
    name: Angular production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Angular production build
        run: npm run build -- --configuration production
      - name: Build production container
        run: docker build --tag cricpulse-ui:ci .


  browser-e2e:
    name: Chromium broadcast browser tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run broadcast browser certification
        run: npx playwright test --config scripts/e2e/playwright.config.mjs
