name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - ui
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - develop
      - ui

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting and TypeScript quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for OBS local relay validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate OBS local relay syntax
        run: python -m py_compile tools/obs-local-relay.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Normalize branch formatting
        if: (github.event_name == 'pull_request' && (github.head_ref == 'feat/universal-broadcast-engine' || github.head_ref == 'feat/smart-match-insights-responsive' || github.head_ref == 'feat/live-obs-overlay-preview' || github.head_ref == 'feat/broadcast-scene-controller' || github.head_ref == 'feat/obs-websocket-scene-switching' || github.head_ref == 'feat/obs-live-scene-sync-reliability' || github.head_ref == 'feat/obs-scene-presets-quick-controls' || github.head_ref == 'feat/obs-auto-scene-event-rules' || github.head_ref == 'feat/obs-automation-profiles' || github.head_ref == 'feat/obs-automation-advanced-rules' || github.head_ref == 'test/offline-reconnect-ack-reconciliation' || github.head_ref == 'feat/scorer-lease-recovery-ux' || github.head_ref == 'feat/isolated-scorer-tab-leases' || github.head_ref == 'feature/obs-websocket-protocol-tests' || github.head_ref == 'feature/serialize-obs-automation-transitions' || github.head_ref == 'fix/obs-stale-socket-close-isolation' || github.head_ref == 'fix/live-score-http-request-teardown' || github.head_ref == 'test/live-score-reconciliation-teardown' || github.head_ref == 'feat/match-intelligence-explainable-v2' || github.head_ref == 'feat/matchup-intelligence-v1' || github.head_ref == 'feat/innings-phase-analysis-v1')) || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          npx --yes prettier@3.5.3 --write "src/app/features/broadcast/pages/overlay/broadcast-overlay.component.{ts,html,scss}" "src/app/features/live/pages/live-scoring/live-scoring.component.ts" "src/app/features/live/pages/live-scoring/live-scoring.component.scss" "src/app/features/live/pages/live-scoring/live-scoring.component.html" "src/app/features/live/pages/live-scoring/live-scoring.component.spec.ts" "src/app/core/services/offline-scoring.store.ts" "src/app/core/services/live-score.service.ts" "src/app/core/services/live-score.service.spec.ts" "src/app/core/services/offline-scoring.store.spec.ts" "src/app/core/services/offline-scoring.runtime.spec.ts" "src/app/core/services/offline-score.reducer.ts" "src/app/core/services/offline-score.reducer.spec.ts" "src/app/features/broadcast/pages/control/broadcast-control.component.ts" "src/app/features/broadcast/pages/control/broadcast-control.component.html" "src/app/features/broadcast/pages/control/broadcast-control.component.scss" "src/app/features/broadcast/pages/obs-scene-controller/obs-scene-controller.component.ts" "src/app/features/broadcast/pages/obs-scene-controller/obs-scene-controller.component.html" "src/app/features/broadcast/pages/obs-scene-controller/obs-scene-controller.component.scss" "src/app/features/broadcast/pages/obs-scene-controller/obs-scene-controller.component.spec.ts" "src/app/features/broadcast/services/obs-websocket.service.ts" "src/app/features/broadcast/services/obs-websocket.service.spec.ts" "src/app/app.routes.ts" "src/app/features/matches/pages/match-detail/match-detail.component.ts" "src/app/features/matches/pages/match-detail/match-detail.component.html" "src/app/features/matches/pages/match-detail/match-detail.component.scss" "src/app/features/matches/pages/match-detail/match-detail.component.spec.ts"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/features/broadcast/pages/overlay/broadcast-overlay.component.{ts,html,scss} src/app/features/live/pages/live-scoring/live-scoring.component.ts src/app/features/live/pages/live-scoring/live-scoring.component.scss src/app/features/live/pages/live-scoring/live-scoring.component.html src/app/features/live/pages/live-scoring/live-scoring.component.spec.ts src/app/core/services/offline-scoring.store.ts src/app/core/services/live-score.service.ts src/app/core/services/live-score.service.spec.ts src/app/core/services/offline-scoring.store.spec.ts src/app/core/services/offline-scoring.runtime.spec.ts src/app/core/services/offline-score.reducer.ts src/app/core/services/offline-score.reducer.spec.ts src/app/features/matches/pages/match-detail/match-detail.component.ts src/app/features/matches/pages/match-detail/match-detail.component.html src/app/features/matches/pages/match-detail/match-detail.component.scss src/app/features/matches/pages/match-detail/match-detail.component.spec.ts src/app/features/broadcast/pages/control/broadcast-control.component.ts src/app/features/broadcast/pages/control/broadcast-control.component.html src/app/features/broadcast/pages/control/broadcast-control.component.scss src/app/features/broadcast/pages/control/broadcast-control.component.spec.ts src/app/features/broadcast/pages/obs-scene-controller/obs-scene-controller.component.ts src/app/features/broadcast/pages/obs-scene-controller/obs-scene-controller.component.html src/app/features/broadcast/pages/obs-scene-controller/obs-scene-controller.component.scss src/app/features/broadcast/pages/obs-scene-controller/obs-scene-controller.component.spec.ts src/app/features/broadcast/services/obs-websocket.service.ts src/app/features/broadcast/services/obs-websocket.service.spec.ts src/app/app.routes.ts
            git commit -m "chore: normalize branch formatting"
            git push origin "${BRANCH}"
          fi
      - name: Verify formatting
        run: npm run format:check
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Audit canonical component structure
        run: npm run component:audit
      - name: Audit route integrity
        run: npm run route:audit
      - name: Audit critical test inventory
        run: npm run test:inventory
      - name: Audit security and API boundaries
        run: npm run security:audit
      - name: Audit feature integration boundaries
        run: npm run feature:audit
      - name: Execute Angular unit tests
        run: npm run test
      - name: Audit legacy compatibility shims
        run: npm run legacy:audit

  build:
    name: Angular production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Angular production build
        run: npm run build -- --configuration production
      - name: Build production container
        run: docker build --tag cricpulse-ui:ci .
