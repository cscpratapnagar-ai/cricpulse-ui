name: Temporary Prettier Normalize

on:
  push:
    branches:
      - feat/obs-broadcast-setup-workflow

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Check the exact PR merge ref
        run: |
          git fetch origin +refs/pull/52/merge:refs/remotes/origin/pr52merge
          git checkout refs/remotes/origin/pr52merge
          npx --yes prettier@3.5.3 --write src/app/features/broadcast/pages/control/broadcast-control.component.html
          git diff -- src/app/features/broadcast/pages/control/broadcast-control.component.html
