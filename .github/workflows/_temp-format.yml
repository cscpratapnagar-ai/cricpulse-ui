name: Temporary Prettier Normalize

on:
  push:
    branches:
      - feat/live-intelligence-panel-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx --yes prettier@3.5.3 --write "src/**/*.{ts,html,scss,css,json}" "scripts/**/*.{mjs,js}" "*.json"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts '*.json'
          git commit -m "chore(frontend): normalize intelligence formatting"
          git push
