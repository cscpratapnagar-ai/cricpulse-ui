name: Format Verification

on:
  push:
    branches: [ui]
  pull_request:
    branches: [ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run format:check
