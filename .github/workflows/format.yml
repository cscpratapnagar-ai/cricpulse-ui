name: Format Verification

on:
  push:
    branches: [ui]
  pull_request:
    branches: [ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify formatting
        run: |
          npx --yes prettier@3.5.3 --write "src/**/*.{ts,html,scss,css,json}" "*.json"
          git diff --exit-code -- "src/**/*" "*.json"
