name: One-time V8 formatting

on:
  push:
    branches:
      - feature/match-intelligence-v8-complete-ui

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - run: npm install --no-audit --no-fund
      - name: Format V8 fielding UI files
        run: |
          npx --yes prettier@3.5.3 --write \
            src/app/features/matches/pages/scorecard/match-scorecard.component.ts \
            src/app/features/matches/pages/scorecard/match-scorecard.component.html \
            src/app/features/tournaments/pages/analytics/tournament-analytics.component.html
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/features/matches/pages/scorecard/match-scorecard.component.ts src/app/features/matches/pages/scorecard/match-scorecard.component.html src/app/features/tournaments/pages/analytics/tournament-analytics.component.html
            git commit -m "style: format V8 fielding UI"
            git push origin "$GITHUB_REF_NAME"
          fi
