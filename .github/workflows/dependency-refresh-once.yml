name: One-time dependency lock refresh

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Regenerate lockfile for Angular 19 manifest
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches the manifest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): align lockfile with Angular 19"
          git push origin develop
