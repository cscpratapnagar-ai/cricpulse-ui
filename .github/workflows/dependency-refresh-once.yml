name: One-time dependency lock refresh

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Rebuild dependency lockfile for Angular 21
        run: |
          rm -f package-lock.json
          npm install --ignore-scripts
      - name: Refresh dependency fixes
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify high-severity dependency audit
        run: npm audit --audit-level=high
      - name: Commit dependency migration
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): migrate Angular 21 toolchain"
          git push origin develop
